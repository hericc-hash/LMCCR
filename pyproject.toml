[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lumbar-cf-report"
version = "0.1.0"
description = "Anatomy-preserving counterfactual lumbar MRI report generation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "PyYAML>=6.0,<7",
  "scikit-learn>=1.3,<2",
  "scipy>=1.10,<2",
  "torch>=2.1",
  "torchvision>=0.16",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dicom = ["pydicom>=3,<4", "Pillow>=10,<13"]
generation = [
  "accelerate>=0.30,<2",
  "peft>=0.11,<1",
  "safetensors>=0.4,<1",
  "sentencepiece>=0.2,<1",
  "transformers>=4.51,<5",
]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 120
